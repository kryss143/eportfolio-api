worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name _;
        root /var/www/html;
        index index.php index.html;

        # Serve static assets directly from nginx — do NOT proxy to PHP.
        # The PHP built-in server is not reliable for serving larger or binary
        # files (it can crash/hang), so nginx reads them from disk directly.
        location ~* ^/build/ {
            root /var/www/html;
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Laravel manifest / hot reload (Vite dev)
        location ~* /\.env {
            deny all;
        }

        # PHP entry point. The fallback must NOT rewrite the URI to plain
        # /index.php (try_files' last-URI fallback does that): with URI intact
        # Laravel would route /admin/login to the login page, but as
        # /index.php Laravel resolves it to / and serves the LANDING page
        # (the "Admin button goes nowhere" bug). A named location keeps the
        # original URI for the upstream request.
        location / {
            try_files $uri $uri/ @laravel;
        }

        location @laravel {
            proxy_pass http://127.0.0.1:9000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;

            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
        }

        location ~ ^/index\.php(/|$) {
            # Pass path-info URIs (/index.php/admin/login) to PHP with the URI
            # INTACT. These don't match the \.php$ regex below, and try_files'
            # fallback to bare /index.php would strip /admin/login, rendering
            # the landing page instead of the login page. php artisan serve
            # handles path-info itself (verified locally) — just forward it.
            proxy_pass http://127.0.0.1:9000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location ~ \.php$ {
            proxy_pass http://127.0.0.1:9000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;

            # Retry on transient backend failures
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
        }
    }
}
