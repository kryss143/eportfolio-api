worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name _;
        root /var/www/html;
        index index.php index.html;

        # Static assets from Vite build (cache-busted)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Laravel manifest / hot reload (Vite dev)
        location ~* /\.env {
            deny all;
        }

        # PHP entry point
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;

            fastcgi_connect_timeout 5s;
            fastcgi_read_timeout 30s;
            fastcgi_send_timeout 30s;

            # Retry on transient backend failures (connection refused, timeout, invalid response)
            fastcgi_next_upstream error timeout invalid_header;
            fastcgi_next_upstream_tries 2;
            fastcgi_next_upstream_timeout 5s;
        }
    }
}
