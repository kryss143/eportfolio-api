# Render service configuration for the Laravel + MongoDB app.
#
# Push this file to the repo root and Render will auto-detect it and set up:
#   - a Web service (Docker build + start command)
#   - the environment variables (sensitive ones marked as SECRETS)

services:
  - type: web
    name: eportfolio-api
    runtime: docker
    env: docker
    dockerfilePath: eportfolioAPI/docker/Dockerfile
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT

  # Optional: queue worker service (uncomment to enable).
  # - type: worker
  #   name: eportfolio-api-worker
  #   runtime: docker
  #   startCommand: php artisan queue:work --tries=3 --timeout=300
  #   envVars:
